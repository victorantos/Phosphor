name: Phosphor
options:
  bundleIdPrefix: com.nestclaw
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9D83USS7P7
    CODE_SIGN_STYLE: Automatic

packages:
  PhosphorShared:
    path: PhosphorShared

targets:
  Phosphor:
    type: application
    platform: iOS
    sources:
      - path: Phosphor
        excludes:
          - Resources
      - path: Phosphor/Resources
        buildPhase: resources
    dependencies:
      - package: PhosphorShared
      - target: PhosphorFilterExtension
        embed: true
        codeSign: true
    configFiles:
      Debug: Config/Phosphor.xcconfig
      Release: Config/Phosphor.xcconfig
    info:
      path: Phosphor/Info.plist
      properties:
        CFBundleDisplayName: Phosphor
        # Pinned here so `xcodegen generate` cannot silently reset the build
        # number — it defaults to 1 for anything project.yml does not declare.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        # Only the encryption built into iOS (HTTPS, and the PIR encryption iOS performs
        # itself), so App Store Connect does not ask the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Supplied by Config/Secrets.xcconfig (gitignored).
        PIRAuthenticationToken: $(PIR_AUTH_TOKEN)
        # Must match PIRConfiguration.serverURL. iOS 27.3 rejects a filter whose
        # runtime URLs differ from these.
        NSPIRConfiguration:
          PIRServerURL: https://pir.phosphor.online
          PrivacyPassIssuerURL: https://pir.phosphor.online
        # SubscriptionGate checks the subscription in the background, so the filter
        # pauses when it ends even if the app is never opened.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.nestclaw.phosphor.subscription-check
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Phosphor/Phosphor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nestclaw.phosphor
        com.apple.developer.networking.networkextension:
          - url-filter-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nestclaw.phosphor
        INFOPLIST_KEY_CFBundleDisplayName: Phosphor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false

  PhosphorFilterExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: PhosphorFilterExtension
    dependencies:
      - package: PhosphorShared
    info:
      path: PhosphorFilterExtension/Info.plist
      properties:
        CFBundleDisplayName: Phosphor Filter
        # XcodeGen omits this for ExtensionKit targets. Without it iOS does not
        # register the extension and the filter fails to start.
        CFBundlePackageType: "XPC!"
        # Must match the app's version and build number.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.networkextension.url-filter-control
        # Required from iOS 27.3: the PIR URLs must be declared statically.
        NSPIRConfiguration:
          PIRServerURL: https://pir.phosphor.online
          PrivacyPassIssuerURL: https://pir.phosphor.online
    entitlements:
      path: PhosphorFilterExtension/PhosphorFilterExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nestclaw.phosphor
        com.apple.developer.networking.networkextension:
          - url-filter-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nestclaw.phosphor.filter-extension
        INFOPLIST_KEY_CFBundleDisplayName: Phosphor Filter

schemes:
  Phosphor:
    build:
      targets:
        Phosphor: all
        PhosphorFilterExtension: all
    run:
      config: Debug
      # Local StoreKit testing: purchases and the free trial are simulated when the
      # app is run from Xcode. Builds run any other way still use the App Store.
      storeKitConfiguration: Phosphor/Resources/Phosphor.storekit
    profile:
      config: Release
    archive:
      config: Release
