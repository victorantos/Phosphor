name: Phosphor
options:
  bundleIdPrefix: com.nestclaw
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9D83USS7P7
    CODE_SIGN_STYLE: Automatic

packages:
  PhosphorShared:
    path: PhosphorShared

targets:
  Phosphor:
    type: application
    platform: iOS
    sources:
      - path: Phosphor
        excludes:
          - Resources
      - path: Phosphor/Resources
        buildPhase: resources
    dependencies:
      - package: PhosphorShared
      - target: PhosphorFilterExtension
        embed: true
        codeSign: true
    info:
      path: Phosphor/Info.plist
      properties:
        CFBundleDisplayName: Phosphor
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Phosphor/Phosphor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nestclaw.phosphor
        com.apple.developer.networking.networkextension:
          - url-filter-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nestclaw.phosphor
        INFOPLIST_KEY_CFBundleDisplayName: Phosphor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false

  PhosphorFilterExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: PhosphorFilterExtension
    dependencies: []
    info:
      path: PhosphorFilterExtension/Info.plist
      properties:
        CFBundleDisplayName: Phosphor Filter
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.networkextension.url-filter-control
    entitlements:
      path: PhosphorFilterExtension/PhosphorFilterExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nestclaw.phosphor
        com.apple.developer.networking.networkextension:
          - url-filter-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nestclaw.phosphor.filter-extension
        INFOPLIST_KEY_CFBundleDisplayName: Phosphor Filter

schemes:
  Phosphor:
    build:
      targets:
        Phosphor: all
        PhosphorFilterExtension: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
