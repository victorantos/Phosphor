<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Phosphor">
  <defs>
    <linearGradient id="ph-ground" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#191613"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </linearGradient>
    <radialGradient id="ph-bloom" cx="0.6" cy="0.36" r="0.5">
      <stop offset="0%" stop-color="#39ff7a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#39ff7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#ph-ground)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#ph-bloom)"/>
  <!-- Mark on the 64 grid, scaled 16x: stem 10x40 r5, dot r10 at (38,22) -->
  <g transform="scale(16)">
    <circle cx="38" cy="22" r="20" fill="#39ff7a" opacity="0.07"/>
    <circle cx="38" cy="22" r="15" fill="#39ff7a" opacity="0.16"/>
    <rect x="16" y="12" width="10" height="40" rx="5" fill="#f6f3ee"/>
    <circle cx="38" cy="22" r="10" fill="#39ff7a"/>
  </g>
</svg>
